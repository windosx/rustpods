[package]
name = "rustpods"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
bluer = { version = "0.17", features = ["full"] }
uuid = "1.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
futures = "0.3"
zbus = { version = "5", features = ["tokio"] }
ksni = "0.3"
# Desktop notifications for incoming ZCode questions (visible in daemon mode).
notify-rust = "4"
image = "0.25"
aes = "0.8"
cipher = "0.4"
libc = "0.2"

# Head-tracked audio. Optional because linking libpipewire pulls in a build-time
# dependency on the PipeWire headers and libclang (pipewire-sys runs bindgen).
pipewire = { version = "0.10", optional = true }
libspa = { version = "0.10", optional = true }

# GUI dependencies
gpui-kit = "0.9.1"

[features]
default = ["audio-follow"]
# Pan the stereo image to follow the wearer's head. Requires libpipewire-0.3
# headers and libclang at build time.
audio-follow = ["dep:pipewire", "dep:libspa"]

# Both examples speak PipeWire directly, so they can only build with the
# feature on. Without this, `cargo test` and `cargo clippy` - which compile
# every target, examples included - fail on `use pipewire` before running a
# single test.
[[example]]
name = "probe_hrtf"
required-features = ["audio-follow"]

[[example]]
name = "verify_hrtf_client"
required-features = ["audio-follow"]
