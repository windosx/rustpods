# Head-tracked audio for RustPods.
#
# ## What this builds
#
#   apps --> rustpods_hrtf_in (Audio/Sink) --> sofa spatializer --> rustpods_hrtf_out --> default sink
#
# The *capture* stream is the one advertised as an Audio/Sink: applications play
# into it, and filter-chain captures that sink's output, runs the graph, and
# sends the result out the playback stream. The playback stream is passive, so it
# follows the current default sink instead of becoming one. This is the shape
# module-filter-chain.c documents for a virtual sink; the reverse arrangement
# produces two unlinked nodes that pass no audio.
#
# ## Which node carries the controls
#
# `param_changed()` calls `spa_filter_graph_set_props(graph, direction, param)`,
# and the sofa control ports are `SPA_FGA_PORT_INPUT`. So Props have to be
# written to the capture stream - `rustpods_hrtf_in` - which is what RustPods
# binds.
#
# ## Direction
#
# The control name carries the graph node name as a prefix, which is why the
# node below is named exactly `spat`.
#
# Azimuth is anti-clockwise from above: 0 in front, 90 to the LEFT. That was
# measured by replicating plugin_sofa.c's call sequence (mysofa_s2c on
# [azimuth, elevation, radius], then mysofa_getfilter_float) against this
# dataset. RustPods maps positive head yaw (turning right) to positive azimuth
# (moving left in head frame), so a source stays put as the head turns.
#
# ## Requirements
#
#   pipewire-module-filter-chain-sofa        (Fedora package)
#   a SOFA dataset - MIT KEMAR is used below
#
# The filename MUST be an absolute path. It is handed to mysofa verbatim; a
# leading "~" is not expanded, the open fails, and the node still appears in the
# mixer while producing silence.
#
# Without the plugin this module fails to load and PipeWire logs it; without the
# dataset the node exists but outputs silence. Either way the audio stage reports
# itself unavailable instead of leaving a dead sink in the mixer.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "RustPods Head-Tracked Stereo"
            media.name       = "RustPods Head-Tracked Stereo"
            filter.graph = {
                nodes = [
                    # One spatializer per input channel. A single sofa node has
                    # mono input, so a direct stereo feed would have been summed
                    # to mono before convolution - which is exactly the "dull,
                    # everything in front" sound. Keeping the channels separate
                    # through their own HRTFs preserves the stereo image, the
                    # way macOS renders each source independently.
                    {
                        type   = sofa
                        label  = spatializer
                        # Control ports are prefixed with this name:
                        # "spatL:Azimuth" and "spatL:Elevation" in the node's Props.
                        # Rest position is +30 degrees (front-left of the listener).
                        name   = spatL
                        config = { filename = "/home/windosx/.local/share/rustpods/sofa/D1_48K_24bit_256tap_FIR_SOFA.sofa" }
                        control = { "Azimuth" = 30.0 "Elevation" = 0.0 "Radius" = 1.5 }
                    }
                    {
                        type   = sofa
                        label  = spatializer
                        # Rest position is 330 degrees (-30, front-right of the listener).
                        name   = spatR
                        config = { filename = "/home/windosx/.local/share/rustpods/sofa/D1_48K_24bit_256tap_FIR_SOFA.sofa" }
                        control = { "Azimuth" = 330.0 "Elevation" = 0.0 "Radius" = 1.5 }
                    }
                    {
                        type   = builtin
                        label  = mixer
                        name   = mixL
                        # Sums spatL:Out L (left speaker to left ear) and spatR:Out L
                        # (right speaker crossfeed to left ear). Gain 0.5 provides
                        # headroom against digital clipping on coherent center material.
                        control = { "Gain 1" = 0.5 "Gain 2" = 0.5 }
                    }
                    {
                        type   = builtin
                        label  = mixer
                        name   = mixR
                        # Sums spatL:Out R (left speaker crossfeed to right ear) and
                        # spatR:Out R (right speaker to right ear).
                        control = { "Gain 1" = 0.5 "Gain 2" = 0.5 }
                    }
                ]
                # FL goes through the left spatialiser, FR through the right.
                # A spatialiser is mono-in / stereo-out (left-ear and right-ear
                # HRIRs), so each input channel produces an ear pair. The two
                # left-ear results are summed into mixL, the two right-ear
                # results into mixR, which is what keeps the stereo image.
                # Port names confirmed from the plugin binary: "In", "Out L",
                # "Out R" - note the spaces.
                links = [
                    { output = "spatL:Out L" input = "mixL:In 1" }
                    { output = "spatR:Out L" input = "mixL:In 2" }
                    { output = "spatL:Out R" input = "mixR:In 1" }
                    { output = "spatR:Out R" input = "mixR:In 2" }
                ]
                inputs  = [ "spatL:In" "spatR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            # The virtual sink applications play into; also where Props land.
            capture.props = {
                node.name    = "rustpods_hrtf_in"
                media.class  = "Audio/Sink"
                node.description = "RustPods Head-Tracked Stereo"
            }
            # Follows whatever sink is currently default.
            playback.props = {
                node.name    = "rustpods_hrtf_out"
                node.passive = true
            }
        }
    }
]
