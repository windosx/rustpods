name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.TAG }}
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            libpipewire-0.3-dev \
            pkg-config \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libudev-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev

      - name: Install packaging tools (cargo-binstall, cargo-deb, cargo-generate-rpm)
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-deb cargo-generate-rpm

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --all-features

      - name: Strip release binary
        run: strip target/release/rustpods

      - name: Package Tarball
        run: |
          ./contrib/scripts/package-tarball.sh "${{ steps.get_version.outputs.VERSION }}" "x86_64"

      - name: Build DEB package
        run: |
          cargo deb --no-build

      - name: Build RPM package
        run: |
          cargo generate-rpm

      - name: Collect Linux artifacts
        run: |
          mkdir -p artifacts
          cp dist/*.tar.gz artifacts/
          cp target/debian/*.deb artifacts/
          cp target/generate-rpm/*.rpm artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (Windows)
        run: cargo build --release --no-default-features

      - name: Package Windows Zip
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $distName = "rustpods-v$ver-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$distName"
          Copy-Item "target/release/rustpods.exe" "dist/$distName/"
          Copy-Item "README.md" "dist/$distName/"
          Copy-Item "README_zh.md" "dist/$distName/"
          Copy-Item "LICENSE" "dist/$distName/"
          Copy-Item "NOTICE" "dist/$distName/"
          New-Item -ItemType Directory -Force -Path "artifacts"
          Compress-Archive -Path "dist/$distName" -DestinationPath "artifacts/$distName.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/*

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux.outputs.tag }}
          name: RustPods ${{ needs.build-linux.outputs.tag }}
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(needs.build-linux.outputs.tag, '-') }}
          generate_release_notes: true
